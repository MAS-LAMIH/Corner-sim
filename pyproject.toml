[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cornersim"
version = "0.1.0"
description = "Validation and dataset utilities for the CornerSim CARLA research framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21,<3", "Pillow>=9,<12", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
cornersim = "cornersim.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration"]
markers = ["carla: requires a running CARLA simulator"]
